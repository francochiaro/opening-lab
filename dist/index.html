(function (g) {
  g.OL_ANN = g.OL_ANN || {};
  g.OL_ANN.italian = {
    '@lessons': [
      { title: 'Why the bishop on c4 eyes f7',
        body: "At the start f7 is Black's weakest square: only the king defends it. A bishop on c4 points straight at it, so a knight on g5 or a queen on f3/h5 can join the pressure quickly. Black must keep an eye on f7 for the whole opening, which slows down their development." },
      { title: 'Why c3 supports d4',
        body: "White would love a big pawn center with pawns on e4 and d4. Playing c3 first means that if Black ever captures ...exd4, White recaptures cxd4 and keeps two central pawns. The cost is that c3 takes the natural square from the b1 knight, which usually travels d2-f1-g3 instead." },
      { title: 'Quiet setup or tactical race?',
        body: "With d3 White plays slowly: protect e4, castle, then improve pieces with Re1, Bb3 and Nbd2. Lines like 4.Ng5 or the Evans Gambit 4.b4 instead start a tactical race where one inaccurate move decides the game. Learn the quiet setup first; use the sharp lines as a surprise weapon, especially in fast games." }
    ],
    '@plans': {
      I01: "Classic slow maneuvering: bring the b1 knight to d2-f1-g3, play h3 to stop ...Bg4 or ...Ng4, and only then think about d4 or a queenside push with a4. Keep the bishop on b3 or c2 so it still eyes f7.",
      I03: "White has active pieces and an isolated pawn on d4. Castle, put rooks on e1 and d1, and use the open e-file. Black wants to trade pieces and blockade d4; you want activity and attacking chances before an endgame arrives.",
      I11: "White has a broad center and Black is solid but cramped. Play Nbd2, Bb3 or Bd3, and consider d5 to gain space or a4-a5 to bother the b6 bishop.",
      I02: "Same plans as the 4.c3 Pianissimo: Re1, Nbd2-f1-g3, h3, and a timely d4 or a4. The game is slow, so improve your worst piece before pushing pawns.",
      I04: "You gave a pawn for a big center and fast development. Play Nc3, Bb2 and think about e5 or d5 to open lines toward Black's king before Black finishes development. If the attack stalls, you are simply a pawn down, so keep playing actively.",
      I12: "The game is quiet and balanced. Castle, play c3 and d3 or d4, and use your queenside space. After the trade on d5 a pawn on d5 cramps Black, and a4-a5 can annoy the bishop.",
      I05: "This is the same slow structure as the Giuoco Pianissimo: Nbd2-f1-g3, h3, and a careful d4 later. Watch out for ...Ng4 ideas against f2 while your knight is on d2.",
      I05B: "A calm position. Continue with Nbd2, Bb3, h3 and Nf1-g3, then decide between d4 and a kingside build-up.",
      I06: "Black has given a pawn for active pieces and attacking chances. Play d4 or d3 to challenge the e4 pawn, castle, and trade pieces when you can: the extra pawn matters more as the board empties.",
      I07: "Black's king is stuck in the center. Bring more pieces (d4 opening lines, Bf4, O-O-O ideas) before cashing in. Calculate carefully: Black's pieces can counterattack if you hurry.",
      I13: "The Traxler is chaotic. You won a pawn and Black's king has moved, but Black has fast development. Castle soon, play d3 and Nc3, and do not grab more material while your king is still in the center.",
      I08: "You have more space after d5. Plan c4 with Nc3, castle, and expand on the queenside. Black will try ...f5 or ...c6 to break your chain.",
      I09: "A solid structure for both sides. Play Nbd2-f1-g3, Bb3 and h3, then aim for d4 when it is well supported.",
      I14: "Checkmate. This pattern works only after Black grabs the queen with ...Bxd1??; stronger opponents never do.",
      I14B: "You won a pawn and kept good development. Castle, play d3, and trade pieces calmly: the extra pawn becomes a real advantage as the board empties.",
      I10: "Black fianchettoed the bishop, so the long diagonal matters. Play Qd2, f3 ideas or Bb3, and keep the knight on d4 well protected. Your space in the center is the main asset.",
      I15: "You traded knights and Black's pawn on d4 is a target. Win it back with cxd4 when it is safe, keep the e-file pressure with Re1, and develop d3 or d4 and Nc3."
    },

    // ---- Opening identity ----
    'e4': { idea: "Takes the center and opens lines for the queen and the light-squared bishop.", plan: "Develop the kingside pieces fast: Nf3 and Bc4 come next." },
    'e4 e5': { what: "Black mirrors you and fights for the center with a pawn of their own.", threat: "Nothing yet; Black also wants quick development." },
    'e4 e5 Nf3': { idea: "Develops a knight and attacks the e5 pawn right away, so Black must defend it.", watch: "Do not bring the queen out early; develop knights and bishops first." },
    'e4 e5 Nf3 Nc6': { what: "Black defends e5 with the knight, the most natural reply.", threat: "The knight also eyes d4 and supports ...d5 later." },
    'e4 e5 Nf3 Nc6 Bc4': { idea: "The Italian bishop points at f7, the square only Black's king defends. It develops and makes castling possible next move.", watch: "The bishop on c4 can be hit by ...d5 or ...Na5, so keep an eye on it.", plan: "Castle, then choose a quiet c3/d3 setup or an active c3/d4 center.", arrows: [['c4', 'f7']] },

    // ---- 3...Bc5 Giuoco Piano ----
    'e4 e5 Nf3 Nc6 Bc4 Bc5': { what: "Black copies you: the bishop on c5 points at your f2 square, just as yours points at f7.", threat: "...Nf6 next to hit e4; in some lines the bishop joins attacks on f2.", avoid: "Do not play an early Ng5 here without calculation; Black has easy development.", arrows: [['c5', 'f2']] },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3': { idea: "c3 prepares d4. If Black ever captures on d4 you can recapture with the c-pawn and keep a big center.", watch: "After c3, e4 is not protected by a knight on c3, so check it before playing d4.", plan: "Develop with ...Nf6 answered by d3 (quiet) or d4 (active).", label: 'Recommended' },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 d3': { idea: "The quiet Giuoco Pianissimo move order: protect e4 first, castle, and play c3 later.", watch: "Black can play ...Na5 to trade your bishop; answer ...Na5 by keeping it with Bb3 when possible.", plan: "O-O, c3, then Bb3 and Re1.", alt: true, label: 'Playable alternative' },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4': { idea: "The Evans Gambit: a pawn gambit. You offer the b4 pawn so that c3 and d4 come with tempo against the black bishop.", watch: "It is a real pawn sacrifice. If your attack fizzles you are just a pawn down.", plan: "After ...Bxb4 play c3, then d4 and castle.", alt: true, label: 'Pawn gambit' },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6': { what: "Black develops and attacks e4 right away.", threat: "...Nxe4 if e4 is left unprotected.", avoid: "Do not ignore e4: either protect it with d3 or push d4 with a clear follow-up." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Qe7': { what: "Black's queen protects e5 so that d4 will not win space with tempo. This is the old main line of the Giuoco Piano.", threat: "Black wants to keep the bishop on the a7-g1 diagonal and hold e5.", avoid: "Do not play Ng5 hoping for f7 tricks; f7 is protected by the queen." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3': { idea: "Protects e4 calmly and keeps the position closed. This is the Giuoco Pianissimo, 'very quiet' Italian.", watch: "Watch for ...Ng4 jumping toward f2 once you castle, especially with the black bishop on c5.", plan: "Castle, then Re1, Bb3 and Nbd2-f1-g3.", mistake: "Rushing Ng5 here only helps Black develop; slow improvement is the point." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4': { idea: "The active option: c3 made d4 possible, and it hits the c5 bishop and the e5 pawn at once.", watch: "After ...exd4 cxd4 Black checks on b4. Block with Bd2; e4 needs care.", plan: "Recapture cxd4 to build the e4-d4 center.", alt: true, label: 'Playable alternative' },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O': { idea: "Get your king safe before anything happens in the center.", watch: "...Bg4 can pin your f3 knight; h3 later is a common answer.", plan: "Re1, then Bb3 and Nbd2." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O': { what: "Black castles too: a calm, symmetrical position.", threat: "Black may play ...a6 and ...Ba7 to keep the bishop safe from d4 or b4." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 d3 Nf6 O-O d6 c3 a6': { what: "Black makes room for the bishop: if you play d4 or b4 later, it can retreat to a7 and stay on the f2 diagonal.", threat: "...Ba7 next; sometimes ...b5 to chase your bishop.", avoid: "Do not let the c4 bishop be trapped by ...b5 and ...Na5; Bb3 keeps it safe." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O Re1': { idea: "The rook supports e4 and prepares d4 later. It also frees f1 for the knight route Nbd2-f1-g3.", watch: "Re1 leaves f2 a little weaker; check ...Ng4 tricks.", plan: "Bb3, h3, Nbd2-f1-g3." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O Re1 a6 Bb3': { idea: "Black's ...a6 prepared ...b5; Bb3 steps back first so the bishop is not chased with tempo and still eyes f7.", watch: "...Na5 can trade the bishop; Bc2 is a retreat if needed.", plan: "Nbd2-f1-g3 and h3." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O Re1 a6 Bb3 Ba7': { what: "...Bc5 to ...Ba7 is a bishop retreat: from a7 it still eyes f2, but a future d4 or b4 will not hit it.", threat: "The a7 bishop keeps pressure on f2 and on d4.", avoid: "Do not push d4 without checking what the a7 bishop and Black's knights then attack." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4': { what: "Black opens the center by taking on d4.", threat: "If you do not recapture, Black keeps a pawn on d4 that cramps you." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4': { idea: "Recapturing with the c-pawn gives you two strong central pawns and attacks the c5 bishop.", watch: "Black's answer ...Bb4+ is coming; prepare to block the check.", plan: "Meet ...Bb4+ with Bd2 for a simple, safe game." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+': { what: "The bishop was attacked, so it escapes with check.", threat: "Black wants to trade pieces and later hit e4 with ...d5." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Bd2': { idea: "The simplest block: you offer a bishop trade and keep your center.", watch: "The sharper 7.Nc3 is not in this course; it allows ...Nxe4 complications.", plan: "Recapture Nbd2 after ...Bxd2+ so the knight protects e4." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Bd2 Bxd2+ Nbxd2': { idea: "The knight recaptures and protects e4 at the same time.", watch: "Black's ...d5 strike is the main idea: it challenges e4 and the c4 bishop.", plan: "After ...d5 take exd5 and hit the knight with Qb3." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Bd2 Bxd2+ Nbxd2 d5': { what: "Black strikes at your center and your c4 bishop.", threat: "...dxc4 or ...dxe4 next.", avoid: "Do not leave both e4 and the c4 bishop hanging; trade on d5." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Bd2 Bxd2+ Nbxd2 d5 exd5': { idea: "Trade the pawn that was attacked and open the e-file toward Black's uncastled king.", watch: "After ...Nxd5 the black knight is centralized; you must keep it under pressure.", plan: "Qb3 attacks d5 and b7." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Bd2 Bxd2+ Nbxd2 d5 exd5 Nxd5 Qb3': { idea: "The queen adds a second attacker on the d5 knight and eyes b7.", watch: "Your d4 pawn is isolated; trades favor Black, activity favors you.", plan: "Castle, Rfe1 and Rac1 or Rad1, and keep pieces active.", arrows: [['b3', 'd5']] },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Qe7 d4': { idea: "With c3 played, d4 now gains space and asks the bishop where it is going.", watch: "Do not take on e5 too soon; your center is stronger when it stays.", plan: "Castle and play Re1 to support e4." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Qe7 d4 Bb6': { what: "...Bc5 to ...Bb6 is a retreat: the bishop was attacked by d4, so it steps back but stays on the diagonal toward f2.", threat: "The bishop on b6 keeps pressure on d4 and f2." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Qe7 d4 Bb6 O-O': { idea: "Castle first; your d4 pawn is well supported by c3 and the f3 knight.", watch: "Black's ...Nf6 hits e4: be ready with Re1.", plan: "Re1, then h3 and Na3 or Nbd2." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Qe7 d4 Bb6 O-O Nf6 Re1': { idea: "The rook protects e4 against ...Nxe4.", watch: "Keep the queen off the e-file while Black's queen sits on e7.", plan: "h3 to stop ...Bg4, then Na3 or Nbd2." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Qe7 d4 Bb6 O-O Nf6 Re1 d6 h3': { idea: "h3 stops ...Bg4, which would pin the f3 knight and add pressure on d4.", watch: "Do not let the d4 pawn become a target; keep it supported by c3 and pieces.", plan: "Na3 or Nbd2, Bb3 or Bf1, and keep the center." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 d3 Nf6 O-O': { idea: "Castle before committing your c-pawn; the center is stable.", watch: "...Ng4 ideas against f2 exist; h3 is often useful.", plan: "c3, then Bb3 and Re1." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 d3 Nf6 O-O d6 c3': { idea: "c3 controls d4 and b4 and prepares d4 later.", watch: "...Na5 can chase the c4 bishop; Bb3 keeps it.", plan: "Bb3 and Re1." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 d3 Nf6 O-O d6 c3 a6 Bb3': { idea: "Bb3 tucks the bishop away from ...b5 and ...Na5 while keeping the f7 diagonal.", watch: "The game is slow; avoid creating weaknesses with pawn moves.", plan: "Re1, Nbd2-f1-g3, h3." },

    // ---- Evans Gambit ----
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4': { what: "Black accepts the pawn gambit and takes b4.", threat: "Black is a pawn up and will try to finish development calmly.", avoid: "Do not try to win the pawn back immediately; use the time instead." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bb6': { what: "Black declines. ...Bb6 keeps the bishop on the diagonal toward f2 instead of taking the pawn.", threat: "Nothing direct; Black wants a calm game.", avoid: "Do not leave the b4 pawn loose; a4 gains space and supports it." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3': { idea: "Hits the bishop and prepares d4: this is the point of the gambit, gaining time.", watch: "The bishop usually goes to a5, from where it pins c3 after d4.", plan: "d4 next, then castle." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5': { what: "The bishop keeps an eye on c3 from a5.", threat: "After d4 ...exd4, the c3 pawn is pinned to your king, so cxd4 is not yet possible." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4': { idea: "Attack the center at once: Black must decide how to handle e5.", watch: "After ...exd4 do not play cxd4 immediately: c3 is pinned by the a5 bishop.", plan: "Castle first, then recapture or play Qb3 against f7." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O': { idea: "Castling removes the pin on c3 and gets your king safe before the center opens.", watch: "Black can grab more with ...dxc3; only play this gambit if you like sharp positions.", plan: "cxd4 next to rebuild the center." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O d6 cxd4': { idea: "Now the pin is gone and you have two big central pawns for the gambit pawn.", watch: "...Bb6 will hit d4; keep it protected.", plan: "Nc3, Bb2, and think about d5 or e5." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O d6 cxd4 Bb6': { what: "The bishop retreats from a5 to b6 and now pressures d4.", threat: "...Bg4 and ...Nxd4 ideas against your center." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bb6 a4': { idea: "Threatens a5, which would attack the b6 bishop with few retreat squares.", watch: "Do not overextend: b4 and a4 need support later.", plan: "Nc3 and castle." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bb6 a4 a6': { what: "...a6 gives the bishop the a7 square, so a5 will not trap it.", threat: "The bishop stays on the a7-g1 diagonal toward f2." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bb6 a4 a6 Nc3': { idea: "Simple development, heading to d5.", watch: "Keep f2 in mind: the b6 bishop still points there.", plan: "Nd5 to trade off a defender." },
    'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bb6 a4 a6 Nc3 Nf6 Nd5': { idea: "The knight hits the b6 bishop and the f6 knight from a strong central square.", watch: "If Black trades ...Nxd5, recapture exd5 to gain space.", plan: "Castle, c3 and d4 or d3." },

    // ---- 3...Nf6 Two Knights ----
    'e4 e5 Nf3 Nc6 Bc4 Nf6': { what: "The Two Knights Defense: Black develops and attacks e4 at once.", threat: "...Nxe4 if e4 is left hanging.", avoid: "Do not play Nc3 and allow forks with ...Nxe4; protect e4 calmly." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 d3': { idea: "The simple, recommended reply: protect e4 and keep a quiet game.", watch: "...d5 is not possible yet without losing a pawn, so Black usually develops.", plan: "c3, castle, Re1 and Bb3.", label: 'Recommended' },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5': { idea: "A sharp module: both your knight and bishop attack f7.", watch: "Black can answer with ...d5 or even ...Bc5 (Traxler). You need preparation.", plan: "After ...d5 play exd5; only after ...Nxd5?! does Nxf7 (Fried Liver) work.", alt: true, label: 'Sharp', arrows: [['g5', 'f7'], ['c4', 'f7']] },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 d3 Bc5': { what: "Black develops the bishop to c5, aiming at f2.", threat: "...Ng4 combined with the bishop on c5 can target f2." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 d3 Be7': { what: "A modest bishop move: Black prepares to castle and keeps a solid shape.", threat: "...d5 later, once e5 is safe." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 d3 Bc5 c3': { idea: "c3 prepares d4 and gives the bishop a b3 retreat. This transposes into the Giuoco Pianissimo.", watch: "...Ng4 tricks against f2 after you castle.", plan: "Castle, Re1, Bb3." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 d3 Be7 O-O': { idea: "Castle first; nothing is happening in the center.", watch: "Black's ...d5 can come; be ready to take exd5.", plan: "Re1, c3, Bb3." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 d3 Be7 O-O O-O Re1': { idea: "Supports e4 and frees f1 for the knight maneuver.", watch: "...d5 strikes: after exd5 Nxd5 the e5 pawn needs defending, so look at Nxe5 chances.", plan: "c3, Bb3, Nbd2-f1." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 d3 Be7 O-O O-O Re1 d6 c3': { idea: "Prepares d4 and Bb3.", watch: "...Na5 hits the bishop; Bb3 or Bb5 are answers.", plan: "Bb3, Nbd2-f1-g3, h3." },

    // ---- 4.Ng5 lines ----
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5': { what: "The main defense: Black blocks the bishop's attack on f7 with a pawn.", threat: "...dxe4 or ...dxc4 if you ignore it.", avoid: "Do not play Nxf7 now: f7 is safe for the moment and you lose material.", weight: 3 },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 Bc5': { what: "The Traxler: Black ignores f7 and counterattacks f2.", threat: "If 5.Nxf7, Black plays ...Bxf2+ with a wild attack on your king.", avoid: "Do not take Nxf7 automatically; Bxf7+ is the simpler capture.", label: 'Sharp', weight: 1 },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5': { idea: "Take the pawn; it also blocks the d-file.", watch: "If Black now plays ...Na5 (the sound move) there is no Fried Liver. If Black plays ...Nxd5?!, Nxf7 becomes possible.", plan: "After ...Na5 check with Bb5+." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5': { what: "The correct defense: the knight attacks your bishop instead of recapturing on d5.", threat: "...Nxc4 trading the bishop, or ...c6 to win the d5 pawn back with active pieces.", avoid: "Do not play Nxf7 here: there is no Fried Liver after ...Na5.", weight: 3 },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5': { what: "Black recaptures with the knight, which leaves f7 weak. This is the condition for the Fried Liver.", threat: "Black hopes for normal development, but the d5 knight and f7 are both exposed.", avoid: "Do not play slowly: this is the moment for Nxf7 or d4.", label: 'Common trap', dubious: true, weight: 1 },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5 Bb5+': { idea: "Check, keeping the bishop out of the knight's reach.", watch: "After ...c6 you will have to give the extra pawn back somehow.", plan: "dxc6 and then Be2." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5 Bb5+ c6 dxc6': { idea: "Take back on c6 so Black's recapture costs time.", watch: "Black gets fast development for the pawn.", plan: "Be2 retreats to a safe square." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5 Bb5+ c6 dxc6 bxc6 Be2': { idea: "Safe retreat; the bishop is out of danger.", watch: "...h6 hits the g5 knight; be ready to step back.", plan: "Nf3 after ...h6." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5 Bb5+ c6 dxc6 bxc6 Be2 h6 Nf3': { idea: "The knight retreats to its natural square.", watch: "...e4 will chase it again.", plan: "Ne5 after ...e4." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5 Bb5+ c6 dxc6 bxc6 Be2 h6 Nf3 e4 Ne5': { idea: "The knight jumps to a strong central square instead of retreating to the rim.", watch: "Black has strong activity; ...Bd6 and ...Qc7 hit e5.", plan: "d4 to support the knight, then castle." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5 Nxf7': { idea: "The Fried Liver: sacrifice the knight on f7 to pull Black's king into the open.", watch: "It only works because of ...Nxd5?!. After Kxf7 you must keep checking and attacking.", plan: "Qf3+ forks the king and the d5 knight.", label: 'Common trap', mistake: "Playing Nxf7 after 5...Na5: then there is no follow-up." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5 Nxf7 Kxf7 Qf3+': { idea: "Check, and the queen also attacks the pinned knight on d5.", watch: "Black's king must defend d5, walking into the center.", plan: "Nc3 adds another attacker on d5.", arrows: [['f3', 'd5']] },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5 Nxf7 Kxf7 Qf3+ Ke6': { what: "The king steps forward to protect the d5 knight.", threat: "Black hopes to consolidate with ...Ncb4 or ...Ne7." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5 Nxf7 Kxf7 Qf3+ Ke6 Nc3': { idea: "Adds a third attacker on d5. Black's king is in the middle of the board.", watch: "Black's ...Ncb4 defends and threatens ...Nxc2+; Qe4 or a3 are typical answers.", plan: "Open lines with d4 and bring the rest of your pieces." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 Bc5 Bxf7+': { idea: "Take f7 with the bishop and check: this avoids the wild ...Bxf2+ lines that follow Nxf7.", watch: "The bishop can be trapped in the center; retreat it to b3 next.", plan: "Bb3, then d3 and Nc3." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 Bc5 Bxf7+ Ke7': { what: "Black's king steps up to e7; it will hide later with ...Rf8 and ...Kd8 ideas.", threat: "...Rf8 and ...Qe8 to use the open f-file." },
    'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 Bc5 Bxf7+ Ke7 Bb3': { idea: "The bishop retreats to a safe square where it still eyes the center.", watch: "Black's pieces become very active on the f-file; watch f2.", plan: "Nc3, d3 and castle quickly." },

    // ---- 3...Be7 Hungarian ----
    'e4 e5 Nf3 Nc6 Bc4 Be7': { what: "The Hungarian Defense: a quiet bishop move that prevents Ng5 tricks against f7.", threat: "Black aims for a solid, compact setup.", avoid: "Do not drift; use the extra time to take the center.", weight: 2 },
    'e4 e5 Nf3 Nc6 Bc4 Be7 d4': { idea: "Black's passive move lets you take the center immediately.", watch: "If Black takes ...exd4, recapture Nxd4 and you have more space.", plan: "Meet ...d6 with d5 to gain space." },
    'e4 e5 Nf3 Nc6 Bc4 Be7 d4 d6': { what: "Black holds e5 with a pawn.", threat: "Nothing direct; Black is solid but passive." },
    'e4 e5 Nf3 Nc6 Bc4 Be7 d4 d6 d5': { idea: "Gain space and push the c6 knight back.", watch: "Black will try ...f5 or ...c6 to break your chain.", plan: "Bd3 then c4." },
    'e4 e5 Nf3 Nc6 Bc4 Be7 d4 d6 d5 Nb8 Bd3': { idea: "The bishop moves out of the way so the c-pawn can advance to c4 and support d5.", watch: "Do not forget to castle; the center is closed but Black can break with ...f5.", plan: "c4, Nc3, O-O." },

    // ---- 3...d6 ----
    'e4 e5 Nf3 Nc6 Bc4 d6': { what: "Black solidly defends e5 but blocks the f8 bishop a little.", threat: "...Bg4 to pin your knight is a common idea.", avoid: "Do not play passively; use your extra development." },
    'e4 e5 Nf3 Nc6 Bc4 d6 c3': { idea: "Simple and solid: prepares d3 or d4 with a stable center.", watch: "...Bg4 pins the f3 knight; h3 or Nbd2 handle it.", plan: "d3, O-O, Re1.", label: 'Recommended' },
    'e4 e5 Nf3 Nc6 Bc4 d6 Nc3': { idea: "Natural development, and it sets up a famous trap if Black plays carelessly.", watch: "The trap only works in one exact sequence; normally you just get a normal game.", plan: "h3 after ...Bg4 asks the bishop to decide.", alt: true, label: 'Common trap' },
    'e4 e5 Nf3 Nc6 Bc4 d6 c3 Nf6 d3': { idea: "Protect e4 and keep a solid Pianissimo-style structure.", watch: "...Ng4 jumps can hit f2.", plan: "Castle and Re1." },
    'e4 e5 Nf3 Nc6 Bc4 d6 c3 Nf6 d3 Be7 O-O': { idea: "King safety first.", watch: "Watch ...Na5 against the c4 bishop.", plan: "Re1, Bb3, Nbd2." },
    'e4 e5 Nf3 Nc6 Bc4 d6 c3 Nf6 d3 Be7 O-O O-O Re1': { idea: "Supports e4 and frees f1 for the knight.", watch: "Do not rush d4 before your pieces are ready.", plan: "Nbd2-f1-g3, Bb3, h3." },
    'e4 e5 Nf3 Nc6 Bc4 d6 Nc3 Bg4': { what: "The bishop pins your f3 knight to the queen.", threat: "...Nd4 and ...Bxf3 ideas to damage your pawns." },
    'e4 e5 Nf3 Nc6 Bc4 d6 Nc3 Bg4 h3': { idea: "Ask the bishop: take on f3 or retreat.", watch: "If Black trades ...Bxf3, recapture Qxf3 calmly; no trap then.", plan: "If ...Bh5, look for Nxe5." },
    'e4 e5 Nf3 Nc6 Bc4 d6 Nc3 Bg4 h3 Bh5': { what: "The bishop keeps the pin but is now loose on h5.", threat: "Black keeps the pin on your f3 knight.", avoid: "Do not miss Nxe5: the pin is not real because of Bxf7+ ideas." },
    'e4 e5 Nf3 Nc6 Bc4 d6 Nc3 Bg4 h3 Bh5 Nxe5': { idea: "The Legal trap: you break the pin and offer your queen. If Black takes it, Bxf7+ and Nd5 is checkmate.", watch: "It only works because Black's bishop is on h5 and your knights and bishop line up. Stronger opponents reply ...Nxe5 or ...dxe5 instead.", plan: "If ...Nxe5, take the h5 bishop with Qxh5.", label: 'Common trap' },
    'e4 e5 Nf3 Nc6 Bc4 d6 Nc3 Bg4 h3 Bh5 Nxe5 Bxd1': { what: "Black grabs your queen. This walks into checkmate.", threat: "None: you mate in two.", avoid: "Do not recapture the bishop: Bxf7+ comes first.", label: 'Common trap', dubious: true, weight: 1 },
    'e4 e5 Nf3 Nc6 Bc4 d6 Nc3 Bg4 h3 Bh5 Nxe5 Nxe5': { what: "Black refuses the queen and takes your knight. This is the sensible reply.", threat: "...Nxc4 next, taking your bishop.", avoid: "Do not take on e5 with anything slow; Qxh5 wins the loose bishop.", weight: 3 },
    'e4 e5 Nf3 Nc6 Bc4 d6 Nc3 Bg4 h3 Bh5 Nxe5 Bxd1 Bxf7+': { idea: "Check: the king has only e7.", watch: "Make sure you play Nd5 next, not Bxd1.", plan: "Nd5 is mate." },
    'e4 e5 Nf3 Nc6 Bc4 d6 Nc3 Bg4 h3 Bh5 Nxe5 Bxd1 Bxf7+ Ke7 Nd5#': { idea: "Checkmate: the knights on d5 and e5 and the bishop on f7 cover every escape square.", plan: "Remember the pattern, but do not expect it against careful opponents." },
    'e4 e5 Nf3 Nc6 Bc4 d6 Nc3 Bg4 h3 Bh5 Nxe5 Nxe5 Qxh5': { idea: "Take the h5 bishop that is no longer protected.", watch: "Your c4 bishop is attacked by the e5 knight.", plan: "After ...Nxc4, Qb5+ forks king and knight." },

      { title: 'One setup for everything',
        body: 'Against almost any unusual first move, play ...d5 and ...Nf6, bring the light-squared bishop out to f5 or g4, and only then play ...e6. It is the same bishop-first rule you use in the Caro-Kann and the Slav, so you never need new theory. Finish with ...c6 or ...c5, castle, and you have a healthy, active position.' },

      { title: 'Transpositions into your own openings',

      { title: 'Attack the defender, not the pawn',
        body: 'Bb5 attacks the knight on c6, and that knight is the piece defending e5. The pressure is indirect: it only becomes a real threat once White has castled and protected e4. That is why Bb5 does not win the e5 pawn by itself.' },
      { title: 'Why keep the light-squared bishop',
        body: 'After ...a6 and ...b5 the bishop retreats to a4, b3 and sometimes c2 instead of trading itself for the knight. From b3 or c2 it keeps looking at f7 and the kingside, which is where White usually attacks later. Giving it up early is a choice (the Exchange Variation), not a necessity.' },
      { title: 'Re1, c3 and d4 work together',
        body: 'Re1 protects e4 so your knight and bishop are free. c3 prepares d4, so that when the pawns trade on d4 you can recapture with a pawn and keep a big center. h3 stops ...Bg4 from pinning the f3 knight before you play d4.' }

      R03: 'Your e5 pawn gives space; develop with Nbd2 or Be3 and challenge the strong e4 knight. Watch the d5 pawn: it is a target for Nd4 and Bc2 pressure.',

    S.moves.push({ san: mv.san, from: mv.from, to: mv.to, promotion: mv.promotion || null, color: mv.color, flags: mv.flags, captured: mv.captured || null, fen: fen, key: key, edge: edge || null });
    S.view = S.moves.length;

    S.sel = null; S.showHint = false; S.showPlan = false;

  function findEdge(node, from, to, promo) {
    if (!node) return null;
    for (var i = 0; i < node.edges.length; i++) {
      var e = node.edges[i];

    }
    return null;

  function truncateTo(i) {
    cancelPending();

    S.completed = null;
    S.feedback = null;
    if (S.mode !== 'free') S.mode = keyAt(i) ? 'book' : 'free';
  }

  function onUserMove(from, to, promo) {
    if (!isLive()) truncateTo(S.view);

    if (S.mode === 'oob') S.mode = 'free';
    var len = S.moves.length;
    var g = new Chess(posFen(len));
    var nodeBefore = curNode();
    var edge = findEdge(nodeBefore, from, to, promo);
    if (S.mode === 'book' && g.turn() !== course().side) return false;
    if (P.active && !P.done && S.mode === 'book' && P.awaiting && !P.answered) {

    }

    if (!mv) return false;
    cancelPending();
    S.paused = !!(P.active && P.answered);
    S.note = null;

    return true;
  }

  function opponentMoveNow() {
    var n = curNode();
    var e = chooseOpponentEdge(n);
    S.thinking = false;
    if (!e) { S.note = 'The book has no supported reply here.'; render(); return; }
    var g = new Chess(posFen(S.moves.length));
    var mv;
    try { mv = g.move(e.promotion ? { from: e.from, to: e.to, promotion: e.promotion } : { from: e.from, to: e.to }); } catch (err) { mv = null; }
    if (!mv) { S.note = 'Book reply could not be played in this exact position.'; render(); return; }
    pushMove(mv, e);
    S.lastOpp = e;
    announce('Opponent played ' + mv.san + '.');
    render();
    continueFlow();
  }

  function scheduleOpponent(delay) {

    S.thinking = true;
    S.timer = setTimeout(function () {

      S.timer = null;

  }

  function chooseOpponentEdge(n) {

    if (g.isGameOver()) return null;
    var legal = g.moves({ verbose: true });
    var cands = n.edges.filter(function (e) {
      return !e.isLearner && e.color === g.turn() && legal.some(function (m) { return m.from === e.from && m.to === e.to && (m.promotion || null) === e.promotion; });

  function exploreFreely() {

  function backToLesson() {

    S.mode = 'book';

  // --------------------------------------------------------------- practice
  function subtreeWeakness(key) {
    var p = cprog(S.cid), gph = graph(), seen = {}, stack = [key], score = 0, count = 0, steps = 0;
    while (stack.length && steps < 400) {
      var k = stack.pop(); steps++;

      var n = gph.nodes[k];
      if (!n) continue;
      if (n.edges.some(function (e) { return e.isLearner; })) {
        var st = p.nodes[k];
        count++;
        score += !st ? 1 : st.m ? 0.05 : clamp((st.a - st.f) / st.a + 0.3, 0, 1);
      }
      n.edges.forEach(function (e) { stack.push(e.toKey); });
    }
    return count ? score / count : 0;
  }

  function lineWeight(l) {
    var p = cprog(S.cid), gph = graph(), w = 0, c = 0;
    var start = course().identity.split(' ').length;
    for (var i = start; i < l.path.length; i++) {
      var n = gph.nodes[l.path[i]];
      if (!n.edges.some(function (e) { return e.isLearner; })) continue;
      var st = p.nodes[n.key];
      w += !st ? 3 : st.m ? 0.2 : 1 + 3 * (st.a - st.f) / st.a;
      c++;
    }
    var tierF = { core: 1, common: 0.8, advanced: 0.45 }[l.def.tier];
    return c ? (w / Math.sqrt(c)) * tierF : 0.1;
  }

  function practicePickLine(exclude) {
    var ls = graph().lines;
    if (P.scope && P.scope !== 'all') return P.scope;
    var pool = ls.filter(function (l) { return l.def.id !== exclude; });
    if (!pool.length) pool = ls;
    return weighted(pool, lineWeight).def.id;
  }

  function startPractice() {
    P = { active: true, mode: store.settings.pmode, len: store.settings.plen, scope: P.scopePick || 'all', scopePick: P.scopePick, results: [], line: null, awaiting: false, answered: null, tries: 0, done: false, streak: 0, best: 0, mistakes: [] };
    S.forced = null;
    practiceNextLine(false);
  }

  function practiceNextLine(different) {
    P.line = practicePickLine(different ? P.line : null);
    practiceStartLine();
  }

  function practiceStartLine() {
    cancelPending();
    S.moves = []; S.view = 0; S.mode = 'book'; S.completed = null; S.feedback = null; S.paused = false; S.sel = null; S.note = null;
    P.awaiting = false; P.answered = null; P.tries = 0;
    var ident = course().identity.split(' ');
    var L = gLine(S.cid, P.line);
    var pre = store.settings.pstart === 'key' ? Math.min(ident.length, L.sans.length) : 0;
    for (var i = 0; i < pre; i++) {
      var g = new Chess(posFen(S.moves.length));
      var mv = g.move(L.sans[i]);
      pushMove(mv, findEdge(curNode(), mv.from, mv.to, mv.promotion));
    }
    S.anim = null;
    render();
    continueFlow();
  }

  function practiceDecisionStart(n) {
    if (P.awaiting && P.key === n.key) return;
    P.awaiting = true; P.answered = null; P.tries = 0; P.key = n.key; P.revealed = P.mode === 'guided';
    P.warmup = S.moves.length < course().identity.split(' ').length;
    P.lastWrong = null;
    P.prevOpp = S.moves.length ? S.moves[S.moves.length - 1].edge : null;
  }

  function recordDecision(key, firstTry, correct) {
    var p = cprog(S.cid);
    var st = p.nodes[key] || (p.nodes[key] = { a: 0, f: 0, s: 0, m: false, t: 0 });
    st.a++;
    if (firstTry && correct) { st.f++; st.s++; } else st.s = 0;
    st.m = st.s >= 3;
    st.t = Date.now();
    p.last = Date.now();
    save();
  }

  function practiceAnswer(node, edge, from, to, promo, g) {
    P.tries++;
    var first = P.tries === 1;
    var path = S.moves.map(function (m) { return m.san; }).join(' ');
    if (P.warmup) {
      if (edge) { P.awaiting = false; P.lastWrong = null; return true; }
      var t2 = new Chess(g.fen()), w = null;
      try { w = t2.move(promo ? { from: from, to: to, promotion: promo } : { from: from, to: to }); } catch (err) { w = null; }
      if (!w) return false;
      sound('wrong');
      P.lastWrong = w.san;
      if (P.mode === 'challenge' || P.tries >= 2) P.revealed = true;
      render();
      return false;
    }
    if (edge) {
      var credit = edge.rec ? 1 : 0.75;
      if (first) {
        recordDecision(node.key, true, true);
        P.results.push({ key: node.key, credit: credit, first: true, san: edge.san, path: path });
        P.streak++; P.best = Math.max(P.best, P.streak);
      } else {
        P.results.push({ key: node.key, credit: 0, first: false, san: edge.san, path: path });
      }
      P.answered = { edge: edge, credit: first ? credit : 0, first: first };
      S.paused = true;
      return true;
    }
    var test = new Chess(g.fen());
    var mv = null;
    try { mv = test.move(promo ? { from: from, to: to, promotion: promo } : { from: from, to: to }); } catch (e) { mv = null; }
    if (!mv) return false;
    sound('wrong');
    var rec = node.edges.filter(function (e) { return e.rec; })[0];
    if (first) {
      recordDecision(node.key, true, false);
      P.streak = 0;
      var p = cprog(S.cid);
      p.mistakes.unshift({ key: node.key, path: path, played: mv.san, expected: rec ? rec.san : '', t: Date.now() });
      p.mistakes = p.mistakes.slice(0, 12);
      P.mistakes.push({ path: path, played: mv.san, expected: rec ? rec.san : '' });
      save();
    }
    P.lastWrong = mv.san;
    if (P.mode === 'challenge' || P.tries >= 2) P.revealed = true;
    S.marks = [to];
    var sess = S;
    setTimeout(function () { if (sess === S) { S.marks = []; drawBoard(); } }, 650);
    render();
    return false;
  }

  function practiceContinue() {
    if (!P.answered) return;
    P.answered = null; P.awaiting = false; P.lastWrong = null;
    if (P.results.length >= P.len) { P.done = true; S.paused = true; render(); confetti(); sound('done'); return; }
    if (S.mode === 'done') { practiceNextLine(true); return; }
    S.paused = false;
    render();
    continueFlow();

  function stopPractice() {

  // ----------------------------------------------------------------- board
  var B = { el: null, sqs: {}, pieces: null, svg: null, drag: null, rdown: null, size: 0 };
  function flipped() { return (course().side === 'b') !== !!S.userFlip; }
  function sqXY(sq) { var f = sq.charCodeAt(0) - 97, r = +sq[1] - 1; return flipped() ? { x: 7 - f, y: r } : { x: f, y: 7 - r }; }
  function xyToSq(x, y) { var f = flipped() ? 7 - x : x, r = flipped() ? y : 7 - y; return 'abcdefgh'[f] + (r + 1); }
  function pointToSq(clientX, clientY) {

    var x = Math.floor((clientX - r.left) / (r.width / 8)), y = Math.floor((clientY - r.top) / (r.height / 8));
    if (x < 0 || y < 0 || x > 7 || y > 7) return null;

  function initBoard() {
    B.el = $('board');

    for (var i = 0; i < 64; i++) html += '<div class="sq" role="gridcell"></div>';
    html += '</div><div class="pieces" id="pieces"></div><svg class="arrows" id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg><div id="badge"></div><div id="promo"></div>';
    B.el.innerHTML = html;

    B.el.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  }
  function sizeBoard() {

  function canMoveFrom(sq) {
    if (!isLive() && S.mode === 'done') return false;
    var g = new Chess(posFen(S.view));
    var p = g.get(sq);
    if (!p) return false;
    if (S.mode === 'free' || S.mode === 'oob' || S.mode === 'done') return p.color === g.turn();
    if (P.active && (P.answered || P.done)) return false;

  }

  }

    var ms = targetsFrom(from).filter(function (m) { return m.to === to; });
    if (!ms.length) return false;
    if (ms.length > 1 && ms[0].promotion) { showPromo(from, to); return true; }
    var ok = onUserMove(from, to, ms[0].promotion || null);

  }

  function showPromo(from, to) {

    }).join('') + '</div></div>';

  function onPointerDown(e) {

    if (e.button !== 0) return;
    if (S.userArrows.length || S.marks.length) { S.userArrows = []; S.marks = []; }
    S.kbd = null;
    if (S.sel && S.sel !== sq) {
      var t = targetsFrom(S.sel).some(function (m) { return m.to === sq; });
      if (t) { var from = S.sel; S.sel = null; tryMove(from, sq); return; }
    }
    if (canMoveFrom(sq)) {

      S.sel = sq;

      var el = B.pieces.querySelector('[data-sq="' + sq + '"]');

    d.el.style.transform = 'translate(' + (e.clientX - r.left - s / 2) + 'px,' + (e.clientY - r.top - s / 2) + 'px) scale(1.08)';
    var over = pointToSq(e.clientX, e.clientY);
    if (over !== d.over) {
      if (d.overEl) d.overEl.classList.remove('hover-target');
      d.over = over;
      d.overEl = over ? B.sqs[over] : null;
      if (d.overEl) d.overEl.classList.add('hover-target');
    }
  }
  function onPointerUp(e) {
    var sq = pointToSq(e.clientX, e.clientY);

      var from = B.rdown; B.rdown = null;

        if (sq === from) {
          var i = S.marks.indexOf(sq);

    if (d.overEl) d.overEl.classList.remove('hover-target');
    if (d.moved) {
      if (sq && sq !== d.sq) {
        var ok = targetsFrom(d.sq).some(function (m) { return m.to === sq; });
        if (ok) { S.sel = null; S.anim = null; B.noAnimOnce = true; tryMove(d.sq, sq); return; }
        S.sel = null;
      }
      drawBoard();
    } else if (d.was) {

  }
  function onBoardKey(e) {
    var k = e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' ', 'Escape'].indexOf(k) < 0) return;
    e.preventDefault();
    e.stopPropagation();
    if (!S.kbd) S.kbd = S.sel || (course().side === 'w' ? 'e2' : 'e7');
    var xy = sqXY(S.kbd);
    if (k === 'ArrowUp') xy.y = clamp(xy.y - 1, 0, 7);
    if (k === 'ArrowDown') xy.y = clamp(xy.y + 1, 0, 7);
    if (k === 'ArrowLeft') xy.x = clamp(xy.x - 1, 0, 7);
    if (k === 'ArrowRight') xy.x = clamp(xy.x + 1, 0, 7);
    S.kbd = xyToSq(xy.x, xy.y);
    if (k === 'Escape') { S.sel = null; }
    if (k === 'Enter' || k === ' ') {
      var sq = S.kbd;
      if (S.sel && targetsFrom(S.sel).some(function (m) { return m.to === sq; })) { var f = S.sel; S.sel = null; tryMove(f, sq); return; }
      if (canMoveFrom(sq)) S.sel = S.sel === sq ? null : sq; else S.sel = null;
    }
    drawBoard();
    var g = new Chess(posFen(S.view)), p = g.get(S.kbd);
    announce(S.kbd + (p ? ', ' + (p.color === 'w' ? 'white ' : 'black ') + PIECE_NAME[p.type] : ', empty') + (S.sel ? '. Selected ' + S.sel : ''));
  }

  function drawBoard() {
    if (!B.el || !S) return;
    var fen = posFen(S.view);
    var g = new Chess(fen);
    var last = S.view > 0 ? S.moves[S.view - 1] : null;
    var targets = S.sel ? targetsFrom(S.sel) : [];
    var checkSq = null;
    if (g.inCheck()) {
      var bd = g.board();
      for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) { var pc = bd[r][f]; if (pc && pc.type === 'k' && pc.color === g.turn()) checkSq = pc.square; }
    }
    B.sqs = {};
    for (var i = 0; i < 64; i++) {
      var x = i % 8, y = Math.floor(i / 8), sq = xyToSq(x, y);
      var fi = sq.charCodeAt(0) - 97, ri = +sq[1] - 1;
      var cell = B.cells[i];
      B.sqs[sq] = cell;
      var dark = (fi + ri) % 2 === 0;
      var cls = 'sq ' + (dark ? 'd' : 'l');
      if ((last && (last.from === sq || last.to === sq)) || S.sel === sq) cls += ' hl';
      if (S.marks.indexOf(sq) >= 0) cls += ' mark';
      if (checkSq === sq) cls += ' check';
      if (S.kbd === sq) cls += ' kbd';
      cell.className = cls;
      var inner = '';
      if (y === 7) inner += '<span class="coord file">' + sq[0] + '</span>';
      if (x === 0) inner += '<span class="coord rank">' + sq[1] + '</span>';
      var t = null;
      for (var j = 0; j < targets.length; j++) if (targets[j].to === sq) t = targets[j];
      if (t) inner += (g.get(sq) || t.flags.indexOf('e') >= 0) ? '<span class="ring"></span>' : '<span class="dot"></span>';
      cell.innerHTML = inner;
      var p = g.get(sq);
      cell.setAttribute('aria-label', sq + (p ? ' ' + (p.color === 'w' ? 'white' : 'black') + ' ' + PIECE_NAME[p.type] : ''));
    }
    B.el.classList.toggle('no-coords', !store.settings.coords);
    // pieces
    var anim = S.anim && S.anim.ply === S.view && !B.noAnimOnce && !reducedMotion ? S.anim : null;
    B.noAnimOnce = false;
    S.anim = null;
    var html = '';
    var animEls = [];
    var bd2 = g.board();
    for (var rr = 0; rr < 8; rr++) for (var ff = 0; ff < 8; ff++) {
      var pp = bd2[rr][ff];
      if (!pp) continue;
      var xy = sqXY(pp.square);
      var start = xy;
      if (anim) {
        if (pp.square === anim.to) { start = sqXY(anim.from); animEls.push(pp.square); }
        if (anim.flags.indexOf('k') >= 0 || anim.flags.indexOf('q') >= 0) {
          var rank = anim.color === 'w' ? '1' : '8';
          var rookFrom = (anim.flags.indexOf('k') >= 0 ? 'h' : 'a') + rank, rookTo = (anim.flags.indexOf('k') >= 0 ? 'f' : 'd') + rank;
          if (pp.square === rookTo) { start = sqXY(rookFrom); animEls.push(pp.square); }
        }
      }
      html += '<div class="piece' + (anim ? ' no-anim' : '') + '" data-sq="' + pp.square + '" data-to="' + xy.x + ',' + xy.y + '" style="background-image:url(' + PIECES[pp.color + pp.type.toUpperCase()] + ');transform:translate(' + start.x * 100 + '%,' + start.y * 100 + '%)"></div>';
    }
    B.pieces.innerHTML = html;
    if (anim && animEls.length) {
      void B.pieces.offsetWidth;
      animEls.forEach(function (sq) {
        var el = B.pieces.querySelector('[data-sq="' + sq + '"]');
        if (!el) return;
        el.classList.remove('no-anim');
        var to = el.getAttribute('data-to').split(',');
        el.style.transform = 'translate(' + to[0] * 100 + '%,' + to[1] * 100 + '%)';
      });
      B.pieces.querySelectorAll('.no-anim').forEach(function (el) { el.classList.remove('no-anim'); });
    }
    drawArrows();
    drawBadge();
    var who = g.turn() === 'w' ? 'White' : 'Black';
    B.el.setAttribute('aria-label', 'Chess board, ' + who + ' to move. Use arrow keys to move the cursor and Enter to select or move.');
    B.el.classList.toggle('grabbable', true);
  }

  function arrowSvg(from, to, color, opacity) {
    var a = sqXY(from), b = sqXY(to);
    var ax = a.x + 0.5, ay = a.y + 0.5, bx = b.x + 0.5, by = b.y + 0.5;
    var dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y);
    var pts = [[ax, ay]];
    if ((dx === 1 && dy === 2) || (dx === 2 && dy === 1)) pts.push(dy === 2 ? [ax, by] : [bx, ay]);
    pts.push([bx, by]);
    var n = pts.length;
    var px = pts[n - 2], ex = pts[n - 1];
    var vx = ex[0] - px[0], vy = ex[1] - px[1], L = Math.sqrt(vx * vx + vy * vy);
    vx /= L; vy /= L;
    var head = 0.42, hw = 0.24;
    var tip = [ex[0] - vx * 0.08, ex[1] - vy * 0.08];
    var base = [tip[0] - vx * head, tip[1] - vy * head];
    var first = pts[1];
    var sx = first[0] - pts[0][0], sy = first[1] - pts[0][1], SL = Math.sqrt(sx * sx + sy * sy);
    pts[0] = [pts[0][0] + sx / SL * 0.18, pts[0][1] + sy / SL * 0.18];
    pts[n - 1] = base;
    var poly = pts.map(function (p) { return p[0].toFixed(3) + ',' + p[1].toFixed(3); }).join(' ');
    var h = [tip, [base[0] - vy * hw, base[1] + vx * hw], [base[0] + vy * hw, base[1] - vx * hw]].map(function (p) { return p[0].toFixed(3) + ',' + p[1].toFixed(3); }).join(' ');
    return '<g opacity="' + (opacity || 0.82) + '"><polyline points="' + poly + '" fill="none" stroke="' + color + '" stroke-width="0.17" stroke-linejoin="round"/><polygon points="' + h + '" fill="' + color + '"/></g>';
  }

  function recEdgeAt(n) { if (!n) return null; for (var i = 0; i < n.edges.length; i++) if (n.edges[i].rec) return n.edges[i]; return null; }

  function drawArrows() {
    if (!B.svg) return;
    var out = '';
    var live = isLive();
    var n = live ? curNode() : null;
    var learnerTurn = live && learnerTurnAt(S.moves.length) && S.mode === 'book';
    var rec = learnerTurn ? recEdgeAt(n) : null;
    if (S.showPlan) {
      var lastE = S.view > 0 ? S.moves[S.view - 1].edge : null;
      if (lastE && lastE.ann && lastE.ann.arrows) lastE.ann.arrows.forEach(function (a) { out += arrowSvg(a[0], a[1], lastE.isLearner ? '#ffaa00' : '#e8573f', 0.75); });
      if (rec && rec.ann && rec.ann.arrows) rec.ann.arrows.forEach(function (a) { out += arrowSvg(a[0], a[1], '#ffaa00', 0.75); });
    }
    if (rec && (S.showHint || (P.active && !P.done && P.awaiting && !P.answered && P.revealed))) out += arrowSvg(rec.from, rec.to, '#5fae3a', 0.9);
    if (store.settings.arrow && !engineHidden()) {
      var ev = Engine.get(posFen(S.view));
      if (ev && ev.best && ev.depth >= 8) out += arrowSvg(ev.best.slice(0, 2), ev.best.slice(2, 4), '#4f8fe0', 0.78);
    }
    S.userArrows.forEach(function (a) { out += arrowSvg(a[0], a[1], '#ffaa00', 0.82); });
    B.svg.innerHTML = out;
  }

  function classifyMove(i) {
    var m = S.moves[i];
    if (!m) return null;
    if (m.edge) return 'book';
    var before = Engine.get(posFen(i)), after = Engine.get(m.fen);
    if (!before || !after || before.depth < 10 || after.depth < 10) return null;
    var wb = winPct(evalNum(before)), wa = winPct(evalNum(after));
    var drop = m.color === 'w' ? wb - wa : wa - wb;
    var uci = m.from + m.to + (m.promotion || '');
    if (before.best === uci) return 'best';
    if (drop <= 2) return 'excellent';
    if (drop <= 5) return 'good';
    if (drop <= 10) return 'inaccuracy';
    if (drop <= 20) return 'mistake';
    return 'blunder';
  }
  function moveAccuracy(i) {
    var m = S.moves[i];
    if (m.edge) return 100;
    var before = Engine.get(posFen(i)), after = Engine.get(m.fen);
    if (!before || !after || before.depth < 10 || after.depth < 10) return null;
    var wb = winPct(evalNum(before)), wa = winPct(evalNum(after));
    var drop = Math.max(0, m.color === 'w' ? wb - wa : wa - wb);
    return clamp(103.1668 * Math.exp(-0.04354 * drop) - 3.1669, 0, 100);
  }

  function drawBadge() {
    var box = $('badge');
    if (!box) return;
    if (S.view === 0 || engineHidden()) { box.innerHTML = ''; return; }
    var c = classifyMove(S.view - 1);
    if (!c) { box.innerHTML = ''; return; }
    var xy = sqXY(S.moves[S.view - 1].to);
    box.innerHTML = '<div class="badge-on-board" style="left:' + ((xy.x + 1) * 12.5) + '%;top:' + (xy.y * 12.5) + '%;background:' + CLS[c].color + '">' + ICON[c] + '</div>';
  }

  // ---------------------------------------------------------- live updates
  function scheduleLive() {
    if (liveTimer) return;
    liveTimer = requestAnimationFrame(function () { liveTimer = null; renderLive(); });
  }
  function renderLive() {
    if (APP.view !== 'course' || !S) return;

    var ml = $('movelist');
    if (ml) { ml.innerHTML = moveListHtml(); scrollMoveList(); }

  }
  function updateEvalBar() {
    var eb = $('evalbar');
    if (!eb) return;
    var hidden = engineHidden() || (P.active && P.mode === 'challenge' && P.awaiting && !P.answered);
    var ev = Engine.get(posFen(S.view));
    var fl = flipped();
    eb.classList.toggle('flipped', fl);
    eb.classList.toggle('off', hidden || !ev);
    var w = hidden || !ev ? 50 : (ev.over ? (ev.over === '1-0' ? 100 : ev.over === '0-1' ? 0 : 50) : winPct(evalNum(ev)));
    eb.querySelector('.fill').style.height = w + '%';

    eb.title = hidden ? 'Evaluation hidden' : ev ? 'Stockfish evaluation (White perspective): ' + evalText(ev) + ', depth ' + (ev.depth > 90 ? '-' : ev.depth) : (Engine.state === 'error' ? 'Analysis unavailable' : 'Analysing...');

  // ------------------------------------------------------------ rendering
  function render() {
    if (APP.view === 'home') return;
    if (!S) return;
    drawBoard();
    renderPlayers();
    renderSide();
    updateEvalBar();
    updateNav();
    if (store.settings.engine) {

  }

  function renderPlayers() {
    var c = course();
    var g = new Chess(posFen(S.view));
    var fl = flipped();
    var bottomColor = fl ? 'b' : 'w';
    var topColor = bottomColor === 'w' ? 'b' : 'w';
    var counts = { w: { p: 8, n: 2, b: 2, r: 2, q: 1 }, b: { p: 8, n: 2, b: 2, r: 2, q: 1 } };
    var mat = { w: 0, b: 0 };
    g.board().forEach(function (row) { row.forEach(function (p) { if (p && p.type !== 'k') { counts[p.color][p.type]--; mat[p.color] += PIECE_VAL[p.type]; } }); });
    function bar(color) {
      var learner = color === c.side;
      var other = color === 'w' ? 'b' : 'w';
      var cap = '';
      ['q', 'r', 'b', 'n', 'p'].forEach(function (t) { for (var i = 0; i < Math.max(0, counts[other][t]); i++) cap += '<img alt="" src="' + PIECES[other + t.toUpperCase()] + '">'; });
      var diff = mat[color] - mat[other];

      var sub = learner ? 'Playing ' + (color === 'w' ? 'White' : 'Black') + ' in the ' + c.name : (S.mode === 'free' ? 'Moving both sides' : 'Plays only moves from this course, never an engine');
      return '<div class="avatar"><img alt="" src="' + PIECES[color + (learner ? 'K' : 'N')] + '"></div><div class="player-name">' + esc(name) + '<small>' + esc(sub) + '</small></div><div class="captured" aria-label="Captured pieces">' + cap + (diff > 0 ? '<span class="adv">+' + diff + '</span>' : '') + '</div>';

  function updateNav() {

    set('nav-prev', S.view === 0);

    } else ml.scrollTop = ml.scrollHeight;
  }

  function crumbsHtml(ctx) {
    var c = course();
    var parts = ['<b>' + esc(c.short) + '</b>'];
    if (ctx && (!ctx.ambiguous || ctx.family)) parts.push(esc(ctx.family || ctx.def.name.split(':')[0]));
    var i = S.view;

  function statusHtml() {
    var c = course();
    if (!isLive()) {

  }

  function learnHtml() {
    var c = course();
    var ctx = lineContext();
    var html = crumbsHtml(ctx) + lineHeadHtml(ctx) + statusHtml();
    var live = isLive();
    var len = S.moves.length;
    var A = annFor(S.cid);
    // feedback on the learner's last move
    if (live && S.feedback && (S.feedback.type === 'rec' || S.feedback.type === 'alt' || S.feedback.type === 'transpose')) {
      var f = S.feedback;
      if (f.type === 'transpose') {
        html += '<div class="coach good"><h3>Transposed back into the book</h3><p>Your move order is different, but it reached a position this course covers, so the lesson continues.</p></div>';
      } else {
        var a = f.edge.ann || {};
        var rec = recEdgeAt(f.node);
        html += '<div class="coach ' + (f.type === 'rec' ? 'good' : 'alt') + '"><h3>' + clsIcon('book') + ' ' + esc(moveLabel(plyOf(f.node), f.edge.san)) + ' ' + (f.type === 'rec' ? 'Recommended' : esc(a.label || 'Playable alternative')) + '</h3>' +
          (f.type === 'alt' && rec ? '<p>This move is in the course. The main recommendation here is ' + esc(moveLabel(plyOf(f.node), rec.san)) + '.</p>' : '') +
          kv([['Why', a.idea], ['Watch out', a.watch], ['Next plan', a.plan], ['Typical mistake', a.mistake]]) + '</div>';
      }
    }
    // last opponent move
    var lastIdx = live ? len - 1 : S.view - 1;
    var lastM = lastIdx >= 0 ? S.moves[lastIdx] : null;
    if (lastM && lastM.edge && !lastM.edge.isLearner && S.mode !== 'free') {

      html += '<div class="coach"><h3>' + ICON.plan.replace('<svg', '<svg width="16" height="16"') + ' Plan</h3><p>' + esc(planText || 'Develop your pieces, castle, and fight for the center.') + '</p></div>';

      '<select class="sel" data-act="pick-line" aria-label="Choose a line to practise">' + lineOptions(S.forced) + '</select></div>';
    html += movesAndAnalysisHtml();

  }

  function pvSan(fen, pv, max) {
    var g = new Chess(fen), out = [];
    var parts = fen.split(' ');
    var num = parseInt(parts[5], 10), white = parts[1] === 'w';
    for (var i = 0; i < Math.min(pv.length, max || 10); i++) {
      var u = pv[i], mv;
      try { mv = g.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] || undefined }); } catch (e) { break; }
      if (white) out.push(num + '.' + mv.san);
      else { out.push(i === 0 ? num + '...' + mv.san : mv.san); num++; }
      white = !white;
    }
    return out.join(' ');
  }

    if (engineHidden()) return head + '<div class="muted">Engine hidden during this drill so it does not give the answer away. It comes back after you answer.</div>';

  function graphHtml() {
    var n = S.moves.length;
    if (n < 1) return '';
    var W = 300, H = 70, pts = [], haveAny = false;
    for (var i = 0; i <= n; i++) {
      var ev = Engine.get(posFen(i));
      var y = ev ? winPct(evalNum(ev)) : null;
      if (ev) haveAny = true;
      pts.push(y);
    }
    if (!haveAny) return '';
    var step = W / Math.max(1, n), d = 'M0,' + H, lastY = 50;
    for (var j = 0; j <= n; j++) {
      var yy = pts[j] == null ? lastY : pts[j];
      lastY = yy;
      d += ' L' + (j * step).toFixed(1) + ',' + (H - yy / 100 * H).toFixed(1);
    }
    d += ' L' + W + ',' + H + ' Z';
    var cx = S.view * step;
    return '<svg class="graph" id="evalgraph" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Advantage graph over the moves played; click to jump to a move" data-n="' + n + '">' +
      '<rect width="' + W + '" height="' + H + '" fill="#403d39"/><path d="' + d + '" fill="#ffffff"/>' +
      '<line x1="0" x2="' + W + '" y1="' + H / 2 + '" y2="' + H / 2 + '" stroke="#8b8987" stroke-width="0.6" stroke-dasharray="3 3"/>' +
      '<line x1="' + cx + '" x2="' + cx + '" y1="0" y2="' + H + '" stroke="#81b64c" stroke-width="2"/></svg>';

  // ------------------------------------------------------------------- tree
  var T = { collapsed: {}, scale: 1, model: null, sig: '', moves: [], cardFor: null, pinned: false };

  function visibleEdges(n) {
    var lim = TIER_RANK[store.settings.tfilter];
    return n.edges.filter(function (e) { return TIER_RANK[e.tier] <= lim; }).sort(function (a, b) {
      if (a.rec !== b.rec) return a.rec ? -1 : 1;
      return a.firstLine - b.firstLine;
    });
  }

  function buildTreeModel() {
    var gph = graph(), visited = {}, id = 0, moves = [];
    visited[gph.rootKey] = true;
    function box(edge, pathSans, depth, parent) {
      var b = { id: 'b' + (id++), moves: [], children: [], depth: depth, xpos: null, parent: parent, kind: edge.isLearner ? 'learner' : 'opp' };
      var cur = edge, path = pathSans.slice();
      for (;;) {
        path.push(cur.san);
        var mv = { edge: cur, path: path.join(' '), key: cur.toKey, ply: path.length - 1, box: b, idx: moves.length };
        b.moves.push(mv); moves.push(mv);
        var child = gph.nodes[cur.toKey];
        if (visited[child.key]) { b.xpos = child.key; break; }
        visited[child.key] = true;
        var vis = visibleEdges(child);
        if (!vis.length) { b.leaf = child; break; }
        if (vis.length === 1) { cur = vis[0]; continue; }
        b.children = vis.map(function (e) { return box(e, path, depth + 1, b); });
        break;
      }
      b.key = b.moves[0].path;
      return b;
    }
    var roots = visibleEdges(gph.nodes[gph.rootKey]).map(function (e) { return box(e, [], 0, null); });
    var firstPathOf = {};
    moves.forEach(function (m) { if (!firstPathOf[m.key]) firstPathOf[m.key] = m.path; });
    return { roots: roots, moves: moves, firstPathOf: firstPathOf };
  }

  function moveText(mv, first) {
    return (mv.ply % 2 === 0 ? (Math.floor(mv.ply / 2) + 1) + '.' : (first ? (Math.floor(mv.ply / 2) + 1) + '...' : '')) + mv.edge.san;
  }

  function treeShellHtml() {
    var f = store.settings.tfilter;
    return '<div class="line-head"><h2>Opening tree</h2><span class="chip">' + GRAPHS[S.cid].lines.length + ' lines</span></div>' +

      [['core', 'Core'], ['common', 'Common practical replies'], ['advanced', 'Advanced (full)']].map(function (o) { return '<button data-act="tfilter" data-v="' + o[0] + '" aria-pressed="' + (f === o[0]) + '">' + o[1] + '</button>'; }).join('') +
      '</div><label class="muted" for="tdepth">Depth</label><select id="tdepth" class="sel" style="width:auto" data-act="tdepth">' + [2, 3, 4, 5, 6, 8, 99].map(function (d) { return '<option value="' + d + '"' + (store.settings.tdepth === d ? ' selected' : '') + '>' + (d === 99 ? 'All levels' : d + ' levels') + '</option>'; }).join('') + '</select>' +
      '<div class="seg"><button data-act="zoom" data-v="-1" aria-label="Zoom out">-</button><button data-act="zoom" data-v="0" aria-label="Reset zoom">100%</button><button data-act="zoom" data-v="1" aria-label="Zoom in">+</button></div>' +

      '<div class="tree-legend"><span><i style="background:var(--opp-node)"></i>Opponent\'s choice</span><span><i style="background:var(--learner-node)"></i>Your move</span><span><i style="background:var(--green);border-radius:50%;width:8px;height:8px"></i>Recommended</span><span>Hover or tap a move for its idea; click loads the exact position.</span></div>' +
      '<div class="tree-scroll" id="tree-scroll"><div id="tree-size" style="position:relative"><div class="tree-canvas" id="tree-canvas"></div></div></div>' +

      '<div class="field"><span class="lbl">Moves on the board</span><div class="movelist" id="movelist" style="max-height:120px">' + moveListHtml() + '</div></div>';
  }

  function textW(s) { return s.length * 7.6 + 10; }

  function treeRender(force) {
    var sig = S.cid + '|' + store.settings.tfilter + '|' + store.settings.tdepth + '|' + JSON.stringify(T.collapsed) + '|' + T.scale + '|' + store.settings.theme;
    var canvas = $('tree-canvas');
    if (!canvas) return;
    if (!force && sig === T.sig && canvas.childNodes.length) { treeSync(); return; }
    T.sig = sig;
    T.model = buildTreeModel();
    var rowH = 46, gap = 30, row = 0, nodesHtml = '', svg = '', maxX = 0;
    var maxDepth = store.settings.tdepth;
    function layout(b, x) {
      var first = true, w = 10;
      b.labels = b.moves.map(function (m, i) { var t = moveText(m, i === 0); w += textW(t); return t; });
      var leafName = '';
      if (b.leaf && b.leaf.leafOf.length) leafName = lineById(b.leaf.leafOf[0]).name;
      if (leafName) w += Math.min(220, leafName.length * 6.2) + 8;
      if (b.xpos) w += 96;
      var hasKids = b.children.length > 0;
      var collapsed = T.collapsed[b.key] != null ? T.collapsed[b.key] : (b.depth + 1 >= maxDepth);
      if (hasKids) w += 26;
      b.x = x; b.w = w; b.collapsed = hasKids && collapsed; b.leafName = leafName;
      if (hasKids && !b.collapsed) {
        b.children.forEach(function (c) { layout(c, x + w + gap); if (first) { b.row = c.row; first = false; } });
      } else b.row = row++;
      maxX = Math.max(maxX, x + w);
    }
    var x0 = 12;
    T.model.roots.forEach(function (r) { layout(r, x0); });
    function emit(b) {
      var y = 14 + b.row * rowH;
      var inner = b.moves.map(function (m, i) {
        return '<button class="tm' + (m.edge.rec ? ' rec' : '') + '" data-act="tmove" data-idx="' + m.idx + '" title="' + esc(m.edge.isLearner ? (m.edge.rec ? 'Recommended' : 'Playable alternative') : TIER_LABEL[m.edge.tier]) + '">' + esc(b.labels[i]) + '</button>';
      }).join('');
      if (b.leafName) inner += '<span class="tname" title="' + esc(b.leafName) + '">' + esc(b.leafName) + '</span>';
      if (b.xpos) inner += '<button class="xpos" data-act="txpos" data-key="' + esc(b.xpos) + '">transposes &rsaquo;</button>';
      if (b.children.length) inner += '<button class="tog" data-act="ttoggle" data-key="' + esc(b.key) + '" aria-label="' + (b.collapsed ? 'Expand' : 'Collapse') + ' branch">' + (b.collapsed ? '+' : '-') + '</button>';
      nodesHtml += '<div class="tnode ' + b.kind + '" data-box="' + b.id + '" style="left:' + b.x + 'px;top:' + y + 'px;width:' + b.w + 'px">' + inner + '</div>';
      if (b.children.length && !b.collapsed) {
        b.children.forEach(function (c) {
          var cy = 14 + c.row * rowH + 17, py = y + 17, px = b.x + b.w, cx = c.x;
          svg += '<path d="M' + px + ',' + py + ' C' + (px + 16) + ',' + py + ' ' + (cx - 16) + ',' + cy + ' ' + cx + ',' + cy + '" fill="none" stroke="#7d7a76" stroke-width="1.6"/>';
          emit(c);
        });
      }
    }
    T.model.roots.forEach(emit);
    var H = 14 + row * rowH + 10, W = maxX + 24;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    canvas.style.transform = 'scale(' + T.scale + ')';
    $('tree-size').style.width = W * T.scale + 'px';
    $('tree-size').style.height = H * T.scale + 'px';
    canvas.innerHTML = '<svg width="' + W + '" height="' + H + '">' + svg + '</svg>' + nodesHtml;
    treeSync(true);
  }

  function treeSync(scrollIntoView) {
    var canvas = $('tree-canvas');
    if (!canvas || !T.model) return;
    var hist = S.moves.slice(0, S.view).map(function (m) { return m.san; }).join(' ');
    var curKey = keyAt(S.view);
    var target = null;
    T.model.moves.forEach(function (m) { if (m.path === hist) target = m; });
    if (!target && curKey) T.model.moves.forEach(function (m) { if (!target && m.key === curKey) target = m; });
    canvas.querySelectorAll('.tm.cur').forEach(function (el) { el.classList.remove('cur'); });
    canvas.querySelectorAll('.tnode.on-path').forEach(function (el) { el.classList.remove('on-path'); });
    if (!target) return;
    var b = target.box;
    while (b) { var el = canvas.querySelector('[data-box="' + b.id + '"]'); if (el) el.classList.add('on-path'); b = b.parent; }
    var btn = canvas.querySelector('[data-idx="' + target.idx + '"]');
    if (btn) {
      btn.classList.add('cur');
      if (scrollIntoView !== false) {
        var sc = $('tree-scroll');
        var bx = (btn.parentNode.offsetLeft + btn.offsetLeft) * T.scale, by = btn.parentNode.offsetTop * T.scale;
        if (bx < sc.scrollLeft + 20 || bx > sc.scrollLeft + sc.clientWidth - 80) sc.scrollLeft = bx - sc.clientWidth / 3;
        if (by < sc.scrollTop + 10 || by > sc.scrollTop + sc.clientHeight - 50) sc.scrollTop = by - sc.clientHeight / 3;
      }
    } else if (scrollIntoView !== false) {
      // move hidden inside a collapsed branch: expand the chain
      var bb = target.box.parent, changed = false;
      while (bb) { if (bb.collapsed) { T.collapsed[bb.key] = false; changed = true; } bb = bb.parent; }
      if (changed) treeRender(true);
    }
  }

  function treeCard(mv, anchor) {
    var box = $('tcard');
    if (!box) return;
    if (!mv) { box.innerHTML = '<div class="tcard"><span class="muted">Hover or tap any move in the tree to see its idea, the threat, the response and one thing to avoid.</span></div>'; T.cardFor = null; return; }
    T.cardFor = mv;
    var e = mv.edge, a = e.ann || {}, c = course();
    var gph = graph();
    var child = gph.nodes[e.toKey];
    var rows;
    if (!e.isLearner) {
      var resp = recEdgeAt(child);
      rows = [['Idea', a.what], ['Threat', a.threat], ['Response', resp ? moveLabel(mv.ply + 1, resp.san) + ((resp.ann && resp.ann.idea) ? ': ' + resp.ann.idea : '') : (child.edges.length ? '' : 'End of the curated line.')], ['One thing to avoid', a.avoid || (resp && resp.ann && resp.ann.mistake)]];
    } else {
      rows = [['Idea', a.idea], ['Threat', a.watch], ['Response', a.plan], ['One thing to avoid', a.mistake]];
    }
    var tag = e.isLearner ? (e.rec ? 'Recommended' : (a.label || 'Playable alternative')) : (a.label || TIER_LABEL[e.tier]);
    var linesHere = e.lines.map(function (id) { return id; }).join(', ');
    box.innerHTML = '<div class="tcard" aria-label="Move details"><h4>' + esc(moveLabel(mv.ply, e.san)) + ' <span class="chip">' + esc(tag) + '</span></h4>' +
      '<dl>' + rows.filter(function (x) { return x[1]; }).map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') + '</dl>' +
      '<div class="muted">' + (e.isLearner ? 'Your move' : (c.side === 'w' ? 'Black' : 'White') + '\'s choice') + ' . lines ' + esc(linesHere) + '</div>' +
      '<div class="btn-row"><button class="btn small primary" data-act="tplay" data-idx="' + mv.idx + '">Play from here</button><button class="btn small" data-act="tdrill" data-idx="' + mv.idx + '">Drill this line</button></div></div>';
  }

  // ------------------------------------------------------------------- home
  function staticBoard(fen, flip) {
    var g = new Chess(fen), html = '<div class="squares" style="position:relative;inset:auto;width:100%;height:100%">';
    for (var i = 0; i < 64; i++) {
      var x = i % 8, y = Math.floor(i / 8);
      var f = flip ? 7 - x : x, r = flip ? y : 7 - y;
      var sq = 'abcdefgh'[f] + (r + 1);
      var p = g.get(sq);
      html += '<div class="sq ' + ((f + r) % 2 === 0 ? 'd' : 'l') + '">' + (p ? '<img alt="" style="width:100%;height:100%;display:block" src="' + PIECES[p.color + p.type.toUpperCase()] + '">' : '') + '</div>';
    }
    return html + '</div>';
  }

  function coverageHtml() {
    function oppSans(cid, path) {
      var gph = GRAPHS[cid], n = gph.nodes[gph.rootKey];
      var list = path ? path.split(' ') : [];
      for (var i = 0; i < list.length && n; i++) {
        var e = null;
        n.edges.forEach(function (x) { if (x.san === list[i]) e = x; });
        n = e ? gph.nodes[e.toKey] : null;
      }
      return n ? n.edges.filter(function (e) { return !e.isLearner; }).map(function (e) { return e.san; }) : [];
    }
    function table(rows, head) {
      return '<table class="guide-table"><thead><tr><th>' + head[0] + '</th><th>' + head[1] + '</th></tr></thead><tbody>' + rows.map(function (r) {
        return '<tr><td>' + r[0].map(function (m) { return '<span class="chip">' + esc(m) + '</span>'; }).join(' ') + '</td><td>' + r[1].map(function (cid) { return '<button class="movechip" data-act="open-course" data-cid="' + cid + '">' + esc(courseById(cid).name) + '</button>'; }).join(' ') + '</td></tr>';
      }).join('') + '</tbody></table>';
    }
    function group(entries) {
      var byKey = {};
      entries.forEach(function (e) { var k = e[1].join('|'); (byKey[k] = byKey[k] || { moves: [], cids: e[1] }).moves.push(e[0]); });
      return Object.keys(byKey).map(function (k) { return [byKey[k].moves, byKey[k].cids]; });
    }
    var black = {};
    COURSES.filter(function (c) { return c.side === 'b'; }).forEach(function (c) {
      oppSans(c.id, '').forEach(function (m) { (black[m] = black[m] || []).push(c.id); });
    });
    var white = {};
    COURSES.filter(function (c) { return c.side === 'w'; }).forEach(function (c) {
      oppSans(c.id, 'e4').forEach(function (m) {
        var label = '1...' + m;
        if (m === 'e5') {
          var afterNf3 = oppSans(c.id, 'e4 e5 Nf3');
          if (oppSans(c.id, 'e4 e5 Nc3').length) label = '1...e5 (2.Nc3)';
          else if (afterNf3.length) {
            afterNf3.forEach(function (m2) {
              var l2 = m2 === 'Nc6' ? '1...e5 2.Nf3 Nc6' : '1...e5 2.Nf3 ' + m2;
              (white[l2] = white[l2] || []).indexOf(c.id) < 0 && white[l2].push(c.id);
            });
            return;
          }
        }
        (white[label] = white[label] || []).indexOf(c.id) < 0 && white[label].push(c.id);
      });
    });
    var bRows = group(Object.keys(black).map(function (m) { return ['1.' + m, black[m]]; }));
    var wRows = group(Object.keys(white).map(function (m) { return [m, white[m]]; }));
    return '<h2 class="section-title">Your repertoire at a glance</h2><p class="section-sub">Built live from the course data: every first move below has a prepared answer. Click a course to open it.</p>' +
      '<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div class="card" style="cursor:auto"><h3><span class="side-dot b"></span>When you play Black: White opens with...</h3>' + table(bRows, ['White plays', 'Your course']) + '</div>' +
      '<div class="card" style="cursor:auto"><h3><span class="side-dot w"></span>When you play White: after 1.e4, Black replies...</h3>' + table(wRows, ['Black plays', 'Your course']) + '</div></div>';
  }

  function renderHome() {
    var app = $('app');
    var cards = COURSES.map(function (c) {
      var g = new Chess();
      c.identity.split(' ').forEach(function (m) { g.move(m); });
      var pr = courseProgress(c.id);
      var pct = pr.total ? Math.round(100 * (pr.mastered * 1 + (pr.seen - pr.mastered) * 0.4) / pr.total) : 0;
      return '<button class="card" data-act="open-course" data-cid="' + c.id + '" aria-label="Open the ' + esc(c.name) + ' course">' +
        '<div class="mini-board">' + staticBoard(g.fen(), c.side === 'b') + '</div>' +
        '<h3><span class="side-dot ' + c.side + '"></span>' + esc(c.name) + '</h3>' +
        '<div class="meta">You play ' + (c.side === 'w' ? 'White' : 'Black') + ' . ' + pr.lines + ' lines . ' + esc(c.display || c.identity.split(' ').map(function (s, i) { return (i % 2 === 0 ? (i / 2 + 1) + '.' : '') + s; }).join(' ')) + '</div>' +
        '<p>' + esc(c.blurb) + '</p>' + suitHtml(c) +
        '<div class="field"><span class="lbl">Your progress: ' + pr.seen + '/' + pr.total + ' decisions seen, ' + pr.mastered + ' mastered</span><div class="progress"><i style="width:' + pct + '%"></i></div></div></button>';
    }).join('');
    var ok = SELFTEST.every(function (r) { return r.ok; }) && DIAG.errors.length === 0;
    var guide = '<table class="guide-table"><thead><tr><th>Opening</th><th>You play</th><th>Elo sweet spot</th><th>Best time controls</th><th>Why</th></tr></thead><tbody>' +
      COURSES.map(function (c) {
        return '<tr><td><b>' + esc(c.name) + '</b></td><td>' + (c.side === 'w' ? 'White' : 'Black') + '</td><td><span class="chip elo">' + esc(c.suit.elo) + '</span></td><td>' + c.suit.tc.map(function (t) { return '<span class="chip tc">' + esc(t) + '</span>'; }).join(' ') + '</td><td style="color:var(--text-2)">' + esc(c.suit.why) + '</td></tr>';
      }).join('') + '</tbody></table>';
    var heroFen = '';
    var hg = new Chess();
    'e4 e5 Nc3 Nf6 f4 d5'.split(' ').forEach(function (m) { hg.move(m); });
    heroFen = hg.fen();
    app.innerHTML = '<div class="home">' +
      '<section class="hero"><div><h1>Learn openings by playing them.</h1><p>Opening Lab drills a complete beginner-friendly repertoire (1.e4 as White; the Caro-Kann, the Slav and one simple setup against everything else as Black) against an opponent that only plays real book moves. A branching tree shows every reply, each decision explains the idea, and Stockfish in your browser shows who is winning after every move.</p>' +
      '<div class="btn-row"><button class="btn primary" data-act="open-course" data-cid="' + (store.settings.course || 'vienna') + '">' + (store.settings.course ? 'Continue: ' + esc(courseById(store.settings.course).name) : 'Start with the Vienna') + '</button>' +
      '<button class="selftest-badge" data-act="selftest" title="Open the self-test report">' + (ok ? '<span class="ok">&#10003;</span>' : '<span class="bad">!</span>') + ' ' + DIAG.linesOk + '/' + DIAG.lines + ' lines validated; ' + DIAG.illegalEdges + ' illegal edges; ' + DIAG.unreachable + ' unreachable lessons</button></div></div>' +
      '<div class="hero-board">' + staticBoard(heroFen, false) + '</div></section>' +
      '<h2 class="section-title">Choose a course</h2><p class="section-sub">Built for roughly 500-900 rapid players who want to understand the replies they actually meet, not memorise 30 moves of grandmaster theory.</p>' +
      '<div class="cards">' + cards + '</div>' +
      coverageHtml() +
      '<h2 class="section-title">Which opening suits you?</h2><p class="section-sub">A high-level guide by rating band and time control. Coach\'s guidance, not statistics: no win rates or popularity numbers are claimed.</p>' + guide +
      '<p class="footnote">The book opponent plays only curated, validated moves and never an engine; evaluations, the eval bar, move labels and accuracy come from Stockfish 19 lite running locally in your browser, and are labelled as such. Rules by chess.js 1.4.0 (BSD-2). Engine: <a href="https://github.com/nmrugg/stockfish.js" target="_blank" rel="noopener">Stockfish.js</a> (GPL-3.0). Pieces: cburnett (CC BY-SA 3.0). Progress is stored only in this browser. Not affiliated with any chess site.</p></div>';
  }
